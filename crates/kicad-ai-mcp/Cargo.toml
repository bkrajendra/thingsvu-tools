[package]
name = "kicad-ai-mcp"
description = "MCP server exposing validated KiCad schematic tools to AI clients"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "kicad-ai-mcp"
path = "src/main.rs"

[dependencies]
kicad-cli-runner = { path = "../kicad-cli-runner" }
kicad-domain = { path = "../kicad-domain" }
kicad-session = { path = "../kicad-session" }
rmcp = { version = "3.7", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "io-std", "sync", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process"] }
